[project]
name = "scaw2-agent"
version = "0.1.0"
description = "SCAW2.0 convert-phase MCP tool server and Kiro agent definitions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT-0" }
dependencies = [
    "mcp[cli]>=1.23.0,<2",
    "pglast>=6.0,<8",
    "boto3>=1.38.18",
    "oracledb>=3.1.1",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools", "mcpserver"]
